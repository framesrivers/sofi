<!doctype html>

<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sofi's Medicine Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a weekly pill organizer. One column; each mealtime is a compartment with a colored lid,
   each medicine a row you tick with your thumb on the right. Sticky day bar on top, info cards at the end. */
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --tray:#E6E4DE; --ink:#1E2124; --muted:#585D62; --line:#D9D6CE;
  --done:#2B7A57; --done-soft:#DDF0E6; --warn:#A8322A; --warn-soft:#F8E3E0; --note:#F6EBCB; --note-ink:#5A4300;
  --lid-pre:#DCD4F6; --lid-pre-ink:#3B2C82;
  --lid-am:#FFE28F;  --lid-am-ink:#4F3B00;
  --lid-mid:#C3E9D4; --lid-mid-ink:#124A31;
  --lid-pm:#CCD5F3;  --lid-pm-ink:#1E2D68;
  --m-doxy:#1D6B64; --m-pred:#6A4FB0; --m-mirt:#B8621F; --m-comf:#2D6FB5; --m-omep:#8A6A12; --m-nutra:#4F7F2E; --m-visb:#A33E73; --m-simp:#3C4A48;
  --f-display:"Fredoka","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131416; --surface:#1D1F22; --tray:#26282C; --ink:#ECEDEE; --muted:#A7ABB0; --line:#34373B;
  --done:#5CC08F; --done-soft:#17352A; --warn:#F08A80; --warn-soft:#3A1E1B; --note:#3A3016; --note-ink:#F5DE9A;
  --lid-pre:#3A3361; --lid-pre-ink:#DDD4FF;
  --lid-am:#4A3C10;  --lid-am-ink:#FFE28F;
  --lid-mid:#1D4433; --lid-mid-ink:#C3E9D4;
  --lid-pm:#27315A;  --lid-pm-ink:#CCD5F3;
  --m-doxy:#5FC2B6; --m-pred:#A992E8; --m-mirt:#E39A5C; --m-comf:#79AEE8; --m-omep:#D8B54E; --m-nutra:#8CC266; --m-visb:#E08AB6; --m-simp:#A6B4B1;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1D1F22; --tray:#26282C; --ink:#ECEDEE; --muted:#A7ABB0; --line:#34373B;
  --done:#5CC08F; --done-soft:#17352A; --warn:#F08A80; --warn-soft:#3A1E1B; --note:#3A3016; --note-ink:#F5DE9A;
  --lid-pre:#3A3361; --lid-pre-ink:#DDD4FF;
  --lid-am:#4A3C10;  --lid-am-ink:#FFE28F;
  --lid-mid:#1D4433; --lid-mid-ink:#C3E9D4;
  --lid-pm:#27315A;  --lid-pm-ink:#CCD5F3;
  --m-doxy:#5FC2B6; --m-pred:#A992E8; --m-mirt:#E39A5C; --m-comf:#79AEE8; --m-omep:#D8B54E; --m-nutra:#8CC266; --m-visb:#E08AB6; --m-simp:#A6B4B1;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
::selection{background:var(--lid-am);color:var(--lid-am-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--done);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}

/* top */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.photo{width:72px;height:72px;border-radius:50%;border:2px dashed var(--line);background:var(--tray);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.1;color:var(--muted);font-weight:500;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.has-img{border:3px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.15)}
h1{font-family:var(--f-display);font-weight:600;font-size:27px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:3px 0 0;font-size:14px;color:var(--muted)}
.lang{display:flex;background:var(--tray);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;font-size:13px;font-weight:600;min-width:40px;height:34px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sync{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="live"] i{background:var(--done)}
.sync[data-state="local"] i{background:#C98A1B}

/* sticky day bar */
.daybar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-4px;padding:8px 4px 10px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;border-bottom:1px solid transparent;transition:border-color .2s}
.daybar.stuck{border-bottom-color:var(--line)}
.arrow{width:48px;height:48px;border-radius:16px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.arrow svg{width:22px;height:22px}
.arrow:disabled{opacity:.3;cursor:default}
.dayhead{text-align:center;min-width:0}
.dayhead .d{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15}
.dayhead .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* week strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 46px;scroll-snap-align:center;border:0;border-radius:14px;background:var(--surface);padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.chip .wd{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip .dn{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1}
.chip .segs{display:flex;gap:2px;height:4px;width:30px}
.chip .segs b{flex:1;border-radius:2px;background:var(--line)}
.chip .segs b.on{background:var(--done)}
.chip.today .wd{color:var(--done)}
.chip[aria-current="date"]{background:var(--ink);color:var(--bg)}
.chip[aria-current="date"] .wd{color:var(--bg);opacity:.8}
.chip[aria-current="date"] .segs b{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.chip[aria-current="date"] .segs b.on{background:var(--bg)}
.chip.all .dn::after{content:"";display:block;width:5px;height:5px;margin:3px auto 0;border-radius:50%;background:var(--done)}
.chip[aria-current="date"].all .dn::after{background:var(--bg)}
.todaybtn{justify-self:center;align-self:center;border:0;background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--done);cursor:pointer}

.notice{background:var(--note);color:var(--note-ink);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.alldone{display:flex;align-items:center;gap:10px;background:var(--done-soft);color:var(--done);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px}
.alldone svg{width:22px;height:22px;flex:none}

/* compartments */
#slots{display:flex;flex-direction:column;gap:14px}
.comp{border-radius:22px;background:var(--tray);padding:5px;scroll-margin-top:90px}
.lid{display:flex;align-items:center;gap:10px;background:var(--lid);color:var(--lid-ink);border-radius:18px 18px 8px 8px;padding:11px 14px}
.lid .nm{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.1}
.lid .tm{font-size:13px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.lid .st{margin-left:auto;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lid .st.due{background:var(--lid-ink);color:var(--lid);border-radius:999px;padding:3px 10px}
.rows{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.dose{display:grid;grid-template-columns:24px 1fr 44px;gap:12px;align-items:center;width:100%;min-height:72px;padding:12px 12px 12px 14px;border:0;border-radius:14px;background:var(--surface);text-align:left;cursor:pointer;transition:background .2s}
.rows .dose:last-child{border-radius:14px 14px 18px 18px}
.pill{width:22px;height:22px;background:var(--mc);border-radius:50%;justify-self:center;position:relative}
.pill.cap{width:14px;height:26px;border-radius:7px;background:linear-gradient(var(--mc) 50%,color-mix(in srgb,var(--mc) 45%,var(--surface)) 50%)}
.pill.chew{border-radius:7px}
.pill.tab::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:color-mix(in srgb,var(--surface) 55%,transparent);border-radius:1px}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.mn{font-weight:600;font-size:16px;line-height:1.25}
.amt{font-size:15px}
.why{font-size:13px;color:var(--muted)}
.course{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:1px}
.dose[aria-checked="true"] .course{display:none}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--tray);color:var(--ink)}
.tag.pre{background:var(--note);color:var(--note-ink)}
.given{font-size:13px;font-weight:600;color:var(--done);margin-top:3px}
.undo{font-size:13px;font-weight:600;color:var(--warn);margin-top:3px}
.check{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s cubic-bezier(.2,.9,.3,1.4)}
.check svg{width:22px;height:22px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.2,.9,.3,1.4)}
.dose[aria-checked="true"]{background:color-mix(in srgb,var(--surface) 70%,var(--done-soft))}
.dose[aria-checked="true"] .check{background:var(--done);border-color:var(--done);transform:scale(1.04)}
.dose[aria-checked="true"] .check svg{opacity:1;transform:none}
.dose[aria-checked="true"] .mn,.dose[aria-checked="true"] .amt{color:var(--muted)}
.dose[aria-checked="true"] .mn{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--done) 60%,transparent)}
.dose[aria-checked="true"] .why,.dose[aria-checked="true"] .tags{display:none}
.dose.arm .check{background:var(--warn-soft);border-color:var(--warn)}
.skip{font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px}
.empty{color:var(--muted);text-align:center;padding:24px;background:var(--surface);border-radius:20px;margin:0}

/* info */
.info{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.info section{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.info h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.info p,.info ul{margin:0;font-size:15px}
.info ul{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.info section.warn{background:var(--warn-soft)}
.info section.warn h3{color:var(--warn)}
.phone{color:inherit;text-decoration:none;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;user-select:all;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.copy{border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:0 18px;height:44px;cursor:pointer}
.err{color:var(--warn);font-size:14px;margin:0}

/* who's marking */
.me{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-6px}
.me b{color:var(--ink);font-weight:600}
.me button{border:0;background:none;padding:4px 2px;font-size:13px;font-weight:600;color:var(--done);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* name sheet */
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,12,14,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:24px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  box-shadow:0 -10px 32px rgba(0,0,0,.18);animation:sheet-up .3s cubic-bezier(.2,.9,.3,1)}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.15}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.sheet input{height:54px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:18px;padding:0 16px;caret-color:var(--done)}
.sheet input:focus{outline:none;border-color:var(--done)}
.sheet .go{height:54px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;cursor:pointer}
.sheet .go:disabled{opacity:.35;cursor:default}
.sheet .later{align-self:center;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:8px}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}

/* heads-up when someone else marks a dose */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;transform:translateX(-50%);width:min(488px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);animation:toast-in .32s cubic-bezier(.2,.9,.3,1.15)}
.toast .tx{flex:1;min-width:0;font-size:15px;line-height:1.35}
.toast .tx b{font-weight:600}
.toast button{flex:none;height:40px;padding:0 16px;border:0;border-radius:999px;background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
@keyframes toast-in{from{transform:translate(-50%,24px);opacity:0}to{transform:translateX(-50%);opacity:1}}
@media (prefers-reduced-motion: reduce){ .sheet,.toast{animation:none} }

@media (hover:hover){ .dose:hover{background:color-mix(in srgb,var(--surface) 88%,var(--ink))} .chip:hover{outline:1.5px solid var(--line)} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

  function course(m, i, slot){
    var L = lang==="es"?1:0, ph = null;
    PHASES[m].forEach(function(p){ if (i>=p.from && i<=p.to) ph = p; });
    if (!ph) return "";
    var n=0, N=0;
    for (var d=ph.from; d<=ph.to; d++){
      var s=schedule(d);
      SLOTS.forEach(function(sl){
        if (s[sl].indexOf(m)<0) return;
        N++;
        if (d<i || (d===i && SLOTS.indexOf(sl)<=SLOTS.indexOf(slot))) n++;
      });
    }
    var txt = ph.f[L];
    if (ph.u==="once") return txt;
    if (ph.open) return txt+" · "+(L?"dosis ":"dose ")+n+" · "+(L?"pregunta a la clínica hasta cuándo":"ask the clinic how long");
    txt += " · "+(ph.u==="day" ? (L?"día ":"day ") : (L?"dosis ":"dose "))+n+(L?" de ":" of ")+N;
    if (n===N && N>1) txt += L?" (última)":" (last)";
    return txt;
  }
  var SLOT_MIN = {pre:450, am:480, mid:780, pm:1200}; // minutes after midnight
  function schedule(i){
    var s = {pre:[],am:[],mid:[],pm:[]};
    if (i>=1 && i<=5) s.pre.push("mirt");
    if (i>=1 && i<=28) s.am.push("doxy");
    if ((i>=1 && i<=8) || (i>=10 && i%2===0)) s.am.push("pred"); // 12h x3 days, 24h x5 days (Nov 10-14), then every other day from Nov 16
    if (i>=1 && i<=7) s.pre.push("omep"); // label: before a meal; given with mirtazapine, 30 min before breakfast
    if (i>=1 && i<=3) s.am.push("comf");
    if (i===30) s.am.push("simp");
    if (i>=1 && i<=28) s.mid.push("nutra");
    if (i>=1 && i<=10) s.mid.push("visb");
    if (i>=0 && i<=27) s.pm.push("doxy");
    if (i>=0 && i<=2) s.pm.push("pred");
    return s;
  }
  function dateOf(i){ return new Date(START.getFullYear(),START.getMonth(),START.getDate()+i); }
  function key(i){ var d=dateOf(i); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function doseId(i,slot,med){ return key(i)+"_"+slot+"_"+med; }
  function idsFor(i){ var s=schedule(i),out=[]; SLOTS.forEach(function(sl){ s[sl].forEach(function(m){ out.push(doseId(i,sl,m)); }); }); return out; }

    var dp = p[0].split("-"), d = new Date(+dp[0], +dp[1]-1, +dp[2]);

  function renderStrip(){
    var t=T[lang], h="";
    for (var i=0;i<=LAST;i++){
      var d=dateOf(i), ids=idsFor(i), n=ids.filter(function(x){return checks[x];}).length;
      var segs=""; for (var k=0;k<ids.length;k++) segs+='<b'+(k<n?' class="on"':'')+'></b>';
      var all = ids.length && n===ids.length;
      h += '<button type="button" class="chip'+(i===ti?" today":"")+(all?" all":"")+'" data-i="'+i+'"'+(i===cur?' aria-current="date"':'')+
           ' aria-label="'+esc(t.longday[d.getDay()]+" "+d.getDate()+", "+n+"/"+ids.length)+'">'+
           '<span class="wd">'+esc(t.weekdays[d.getDay()])+'</span><span class="dn">'+d.getDate()+'</span><span class="segs">'+segs+'</span></button>';

  function slotState(sl, list){
    var done = list.filter(function(m){ return checks[doseId(cur,sl,m)]; }).length;
    if (done===list.length) return {cls:"", txt:T[lang].done+" · "+done+"/"+list.length};
    if (cur===ti){ var n=new Date(), mins=n.getHours()*60+n.getMinutes(); if (mins>=SLOT_MIN[sl]-30) return {cls:"due", txt:T[lang].due+" · "+done+"/"+list.length}; }
    return {cls:"", txt:done+"/"+list.length};
  }

  function renderDay(){
    var t=T[lang], d=dateOf(cur), s=schedule(cur), L=lang==="es"?1:0;
    $("dlabel").textContent = lang==="es" ? (t.longday[d.getDay()]+" "+d.getDate()+" de "+t.months[d.getMonth()]) : (t.longday[d.getDay()]+", "+t.months[d.getMonth()].slice(0,3)+" "+d.getDate());

    SLOTS.forEach(function(sl){

      var st = slotState(sl, s[sl]);
      h += '<section class="comp" id="comp-'+sl+'" style="--lid:var(--lid-'+sl+');--lid-ink:var(--lid-'+sl+'-ink)">'+
           '<div class="lid"><div><div class="nm">'+esc(t.slots[sl])+'</div><div class="tm">'+esc(t.times[sl])+'</div></div><span class="st '+st.cls+'">'+esc(st.txt)+'</span></div><div class="rows">';

             '<span class="pill '+M.form+'" aria-hidden="true"></span>'+
             '<span class="body"><span class="mn">'+esc(L?M.es:M.nm)+'</span><span class="amt">'+esc(M.amt[L])+'</span><span class="course">'+esc(course(m,cur,sl))+'</span>'+
             '<span class="why">'+esc(M.why[L])+'</span>'+(tags?'<span class="tags">'+tags+'</span>':'')+foot+'</span>'+

  // On first load of today, bring the compartment that's due into view.

    if (didScroll || cur!==ti || mode==="wait") return;

    if (due && window.scrollY < 40) due.closest(".comp").scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});

  function setCheck(id, on){
    var was = checks[id];
    if (on) checks[id] = myName ? {at:new Date().toISOString(), by:myName} : {at:new Date().toISOString()}; else delete checks[id];
    mine[id] = Date.now();
    $("err").hidden = true;
    renderStrip(); renderDay();
    if (on && navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }
    if (mode==="live" && db){
      var payload = {done:true, at:on ? checks[id].at : ""}; if (on && checks[id].by) payload.by = checks[id].by;
      var p = on ? db.doc("checks/"+id).set(payload) : db.doc("checks/"+id).delete();
      p.catch(function(){
        if (was) checks[id]=was; else delete checks[id];
        $("err").textContent = T[lang].saveErr; $("err").hidden = false; renderStrip(); renderDay();
      });
    } else { saveLocal(); }
  }
  function tap(id){
    if (!checks[id]) {
      armed = null;
      if (!myName && !skipName) return openSheet(id);
      return setCheck(id, true);
    }
    // Unchecking is shared with everyone, so it takes a second tap.
    if (armed === id) { armed = null; clearTimeout(armTimer); return setCheck(id, false); }
    armed = id; clearTimeout(armTimer);
    armTimer = setTimeout(function(){ armed = null; renderDay(); }, 3000);
    renderDay();
  }

  $("slots").addEventListener("click", function(e){ var b=e.target.closest(".dose"); if (b) tap(b.dataset.id); });

  $("next").onclick=function(){ if (cur<LAST){ cur++; armed=null; renderStrip(); renderDay(); } };
  $("todaybtn").onclick=function(){ cur=Math.min(Math.max(ti,0),LAST); renderStrip(); renderDay(); };
  function setLang(l){ lang=l; try{ localStorage.setItem("sofi-lang",l); }catch(e){} render(); }
  $("lang-en").onclick=function(){ setLang("en"); };
  $("lang-es").onclick=function(){ setLang("es"); };

  // Hairline under the day bar once it sticks.
  var bar=$("daybar"), barTop=0;
  function onScroll(){ bar.classList.toggle("stuck", window.scrollY > barTop + 4); }
  window.addEventListener("scroll", onScroll, {passive:true});
  // Refresh "Due now" labels and today's date as time passes.
  setInterval(function(){ var t2=todayIndex(); if (t2!==ti){ ti=t2; renderStrip(); } renderDay(); }, 60000);

  render();
  barTop = bar.getBoundingClientRect().top + window.scrollY;

  function goLocal(m){ mode=m; loadLocal(); render(); scrollToDue(); }
  // Show the last checks this phone saw right away, then go live.
  loadLocal(); render();
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    var timer=setTimeout(function(){ if (mode==="wait") goLocal("fail"); },10000);
    var firstSnap = true;
    db.collection("checks").onSnapshot(function(snap){
      clearTimeout(timer);
      // After the first load, announce changes made on other phones.
      if (!firstSnap && !snap.metadata.hasPendingWrites){
        snap.docChanges().forEach(function(ch){
          var id = ch.doc.id;
          if (mine[id] && Date.now()-mine[id] < 15000) return;
          if (ch.type==="added") notify(id, ch.doc.data().by, true);
          else if (ch.type==="removed") notify(id, null, false);
        });
      }
      firstSnap = false;
      var next={};
      snap.docs.forEach(function(doc){ var v=doc.data(); if (v && v.done) next[doc.id]= v.by ? {at:v.at, by:v.by} : {at:v.at}; });
      checks=next; saveLocal(); mode="live"; render(); scrollToDue();
    }, function(){ clearTimeout(timer); db=null; goLocal("fail"); });
  } catch(e){ goLocal("local"); }
})();
</script>

</body>
</html>
